name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package all platforms
        run: sh scripts/package.sh "${GITHUB_REF_NAME}" dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Git Protect ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

  npm:
    needs: test
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Build npm packages
        run: sh scripts/npm-build.sh "${GITHUB_REF_NAME}" npm-dist

      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        run: sh scripts/npm-publish.sh npm-dist

      - name: Skip notice
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "::warning::NPM_TOKEN secret is not set; npm publishing was skipped."
